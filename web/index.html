<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>TIME ECHO · 時間分身（手機測試版）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <main id="stage">
        <canvas id="out" aria-label="輸出畫面"></canvas>
        <video id="feed" playsinline muted></video>
        <div id="hud">
            <span id="status"></span>
            <ul id="notes"></ul>
        </div>
        <canvas id="mask-view" aria-label="遮罩" hidden></canvas>
        <button id="btn-rec" aria-pressed="false" disabled>錄影</button>
        <div id="rec-result" hidden>
            <span id="rec-info"></span>
            <button id="btn-share">分享</button>
            <a id="link-download" class="button">下載</a>
            <button id="btn-rec-close">關閉</button>
        </div>
        <section id="start">
            <h1>TIME ECHO</h1>
            <p class="sub">時間分身 · 手機測試版</p>
            <p id="start-msg">選一個畫面來源。攝影機畫面只在這台裝置上處理，不會上傳。</p>
            <div class="start-buttons">
                <button id="btn-camera" class="primary">開啟攝影機</button>
                <button id="btn-file">選擇影片</button>
                <button id="btn-demo">示範動畫</button>
            </div>
            <input id="file-video" type="file" accept="video/*" hidden>
        </section>
    </main>
    <nav id="bar">
        <button id="btn-freeze" disabled>凍結</button>
        <button id="btn-flip" disabled>切換鏡頭</button>
        <button id="btn-reset" disabled>重設記憶</button>
        <button id="btn-source" disabled>換來源</button>
        <button id="btn-panel" aria-expanded="true">收起面板</button>
    </nav>
    <section id="panel">
        <div id="tabs" role="tablist"></div>
        <div id="pages"></div>
    </section>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input id="file-preset" type="file" accept="application/json,.json" hidden>
<input id="file-music" type="file" accept="audio/*" hidden>
<audio id="music" loop></audio>
<script type="module" src="js/main.js"></script>
</body>
</html>
